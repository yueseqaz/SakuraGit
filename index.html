<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f3f6f8" />
    <script>
      let appearance = 'system';
      let palette = 'mist';
      try {
        const p = JSON.parse(localStorage.getItem('gitlane.appearance.v1'));
        if (
          p &&
          ['mist', 'graphite', 'forest', 'sand'].includes(p.palette) &&
          ['light', 'dark', 'system'].includes(p.appearance)
        ) {
          appearance = p.appearance;
          palette = p.palette;
        }
      } catch (_) {}
      document.documentElement.dataset.palette = palette;
      document.documentElement.dataset.theme =
        appearance === 'system'
          ? matchMedia('(prefers-color-scheme: dark)').matches
            ? 'dark'
            : 'light'
          : appearance;
    </script>
    <title>SakuraGit — Git, in perspective.</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
